<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Maafi 🌸</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --rose: #e8637a;
      --rose-light: #f5a0af;
      --rose-pale: #fde8ec;
      --cream: #fff8f5;
      --ink: #3a1f28;
      --ink-soft: #9a6070;
      --gold: #d4956a;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #fff0f3 0%, #fff8f5 50%, #f0faf5 100%);
      font-family: 'Kalam', cursive;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      overflow-y: auto;
      position: relative;
      padding: 20px 16px;
    }

    /* Petals */
    .petal {
      position: fixed;
      width: 10px;
      height: 16px;
      background: radial-gradient(ellipse at 40% 30%, #f9c6ce, #e8637a66);
      border-radius: 50% 0 50% 0;
      opacity: 0;
      animation: fall linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes fall {
      0%   { transform: translateY(-40px) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.6; }
      90%  { opacity: 0.4; }
      100% { transform: translateY(110vh) rotate(600deg) translateX(30px); opacity: 0; }
    }

    /* Card */
    .card {
      background: white;
      border-radius: 28px;
      padding: 36px 28px 36px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow:
        0 4px 6px #e8637a12,
        0 20px 60px #e8637a1a,
        0 0 0 1.5px #f5a0af55;
      position: relative;
      z-index: 10;
      animation: cardIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }

    @keyframes cardIn {
      from { transform: scale(0.8) translateY(20px); opacity: 0; }
      to   { transform: scale(1) translateY(0); opacity: 1; }
    }

    .emoji-top {
      font-size: 52px;
      display: block;
      margin-bottom: 8px;
      animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-8px); }
    }

    .title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.4rem, 5vw, 1.9rem);
      color: var(--rose);
      margin-bottom: 4px;
      font-style: italic;
      line-height: 1.3;
    }

    .subtitle {
      font-size: 0.82rem;
      color: var(--ink-soft);
      letter-spacing: 0.04em;
      margin-bottom: 24px;
      font-style: italic;
    }

    .message {
      font-size: clamp(0.9rem, 3.5vw, 1rem);
      color: var(--ink);
      line-height: 1.85;
      background: var(--rose-pale);
      border-radius: 18px;
      padding: 18px 20px;
      margin-bottom: 28px;
      border-left: 3px solid var(--rose-light);
      text-align: center;
      word-break: break-word;
    }

    .sorry-text {
      font-size: clamp(1rem, 4vw, 1.2rem);
      font-weight: 700;
      color: var(--rose);
      display: block;
      margin: 10px 0 6px;
      line-height: 1.5;
      animation: pulse-color 2.5s ease-in-out infinite;
    }

    @keyframes pulse-color {
      0%, 100% { color: var(--rose); }
      50%       { color: #c74b62; }
    }

    /* Buttons */
    .btn-yes {
      background: linear-gradient(135deg, #e8637a, #c74b62);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 16px 40px;
      font-family: 'Kalam', cursive;
      font-size: clamp(1rem, 4vw, 1.1rem);
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 18px #e8637a44;
      transition: transform 0.15s, box-shadow 0.15s;
      display: block;
      width: 100%;
      max-width: 280px;
      margin: 0 auto 14px;
    }

    .btn-yes:hover, .btn-yes:active {
      transform: scale(1.05);
      box-shadow: 0 6px 24px #e8637a66;
    }

    .btn-no {
      background: #f3f3f3;
      color: #aaa;
      border: 2px dashed #ddd;
      border-radius: 50px;
      padding: 12px 28px;
      font-family: 'Kalam', cursive;
      font-size: clamp(0.85rem, 3.5vw, 0.95rem);
      cursor: pointer;
      position: fixed;
      z-index: 9999;
      white-space: nowrap;
      transition: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Success */
    .success-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 10px 0;
    }

    .success-screen.show { display: flex; }

    .success-emoji {
      font-size: 64px;
      animation: heartbeat 0.5s ease-in-out 4;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.25); }
    }

    .success-msg {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.3rem, 5vw, 1.6rem);
      color: var(--rose);
      font-style: italic;
    }

    .success-sub {
      color: var(--ink-soft);
      font-size: clamp(0.85rem, 3.5vw, 1rem);
    }

    .success-note {
      font-size: clamp(0.78rem, 3vw, 0.88rem);
      color: #b8909a;
      margin-top: 4px;
      line-height: 1.6;
    }

    /* Confetti & hearts */
    .confetti-piece {
      position: fixed;
      width: 8px;
      height: 8px;
      opacity: 0;
      pointer-events: none;
      animation: confettiFall 1.6s ease-out forwards;
      z-index: 9998;
    }

    @keyframes confettiFall {
      0%   { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: translateY(260px) rotate(540deg) scale(0.2); opacity: 0; }
    }

    .hearts-burst {
      position: fixed;
      font-size: 20px;
      pointer-events: none;
      animation: heartBurst 1.1s ease-out forwards;
      z-index: 9999;
    }

    @keyframes heartBurst {
      0%   { transform: scale(0) translateY(0); opacity: 1; }
      60%  { opacity: 1; }
      100% { transform: scale(1.4) translateY(-90px); opacity: 0; }
    }
  </style>
</head>
<body>

<div id="petals"></div>

<div class="card" id="mainCard">

  <!-- Apology section -->
  <div id="apologySection">
    <span class="emoji-top" id="topEmoji">🥺</span>
    <h1 class="title" id="mainTitle">Maafi Maango?</h1>
    <p class="subtitle">ek chhoti si request hai...</p>

    <div class="message">
      Pata hai maine galat kiya.<br/>
      Tumhare dil ko takleef pahunchi —<br/>
      woh meri galti thi.<br/><br/>
      <span class="sorry-text" id="sorryText">Dil se maafi mangta hoon. 🙏</span>
      Bas ek baar maaf kar do... please?
    </div>

    <button class="btn-yes" id="yesBtn" onclick="handleYes()">💖 Maaf kar diya</button>
    <button class="btn-no" id="noBtn">Nahi maafunga 😤</button>
  </div>

  <!-- Success section -->
  <div class="success-screen" id="successSection">
    <div class="success-emoji">🥰</div>
    <div class="success-msg">Shukriya Shreya! 💕</div>
    <div class="success-sub">Tum bahut achhi ho... ❤️</div>
    <div class="success-note">Waada hai —<br/>aage se hamesha dhyan rakhunga. 🌸</div>
  </div>

</div>

<script>
  /* ── Petals ── */
  const petalContainer = document.getElementById('petals');
  for (let i = 0; i < 16; i++) {
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.animationDuration = (6 + Math.random() * 8) + 's';
    p.style.animationDelay = (Math.random() * 12) + 's';
    petalContainer.appendChild(p);
  }

  /* ── Position "No" button ── */
  const noBtn = document.getElementById('noBtn');
  let noBtnPlaced = false;

  function placeNoBtnInitial() {
    const card = document.getElementById('mainCard');
    const rect = card.getBoundingClientRect();
    noBtn.style.left = Math.min(rect.left + rect.width/2 + 30, window.innerWidth - 180) + 'px';
    noBtn.style.top  = Math.min(rect.bottom - 60, window.innerHeight - 80) + 'px';
    noBtnPlaced = true;
  }

  setTimeout(placeNoBtnInitial, 100);

  /* ── Texts ── */
  let attempts = 0;
  const sorryTexts = [
    "Dil se maafi mangta hoon. 🙏",
    "Sacchi mein bahut bura lag raha hai... please? 🥺",
    "Baar baar maafi maangunga jab tak maaf na karo! 😢",
    "Tum maaf kar do, main sudhar jaaunga... pakka! 💝",
    "Ek baar... bas ek baar maaf kar do Shreya... 🌸"
  ];
  const titleTexts = [
    "Maafi Maango?",
    "Please... Maaf Karo? 🙏",
    "Abhi Bhi Soch Rahi Ho? 🥺",
    "Maaf Karo Na Yaar...",
    "Last Chance... Please? 💕"
  ];
  const emojis = ["🥺","😢","😭","🙏","💔"];

  function runAway() {
    attempts++;
    // update texts
    const idx = Math.min(attempts, sorryTexts.length - 1);
    document.getElementById('sorryText').textContent = sorryTexts[idx];
    document.getElementById('mainTitle').textContent = titleTexts[idx];
    document.getElementById('topEmoji').textContent  = emojis[idx];

    // move button to random safe position
    const margin = 60;
    const w = window.innerWidth;
    const h = window.innerHeight;
    const bw = noBtn.offsetWidth  || 160;
    const bh = noBtn.offsetHeight || 50;

    const x = margin + Math.random() * (w - bw - margin * 2);
    const y = margin + Math.random() * (h - bh - margin * 2);

    noBtn.style.left = x + 'px';
    noBtn.style.top  = y + 'px';
  }

  noBtn.addEventListener('mouseenter', runAway);
  noBtn.addEventListener('touchstart', (e) => { e.preventDefault(); runAway(); }, { passive: false });
  noBtn.addEventListener('click', (e) => { e.preventDefault(); runAway(); });

  /* ── Yes ── */
  function handleYes() {
    burstHearts();
    launchConfetti();
    setTimeout(() => {
      document.getElementById('apologySection').style.display = 'none';
      noBtn.style.display = 'none';
      document.getElementById('successSection').classList.add('show');
    }, 400);
  }

  function burstHearts() {
    const emojiList = ['💖','💕','🌸','💗','✨','🥰','💝','🌹'];
    const rect = document.getElementById('yesBtn').getBoundingClientRect();
    for (let i = 0; i < 14; i++) {
      const h = document.createElement('div');
      h.className = 'hearts-burst';
      h.textContent = emojiList[Math.floor(Math.random() * emojiList.length)];
      h.style.left = (rect.left + 20 + Math.random() * (rect.width - 40)) + 'px';
      h.style.top  = (rect.top + 10 + Math.random() * 20) + 'px';
      h.style.animationDelay = (Math.random() * 0.4) + 's';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 1600);
    }
  }

  function launchConfetti() {
    const colors = ['#e8637a','#f5a0af','#d4956a','#f9c6ce','#c74b62','#ffd6e0'];
    for (let i = 0; i < 50; i++) {
      const c = document.createElement('div');
      c.className = 'confetti-piece';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.left = (5 + Math.random() * 90) + 'vw';
      c.style.top  = (10 + Math.random() * 50) + 'vh';
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      c.style.animationDelay = (Math.random() * 0.6) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 2200);
    }
  }
</script>
</body>
</html>
