<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>I'm Sorry Shreya 🌸</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Kalam:wght@400;700&family=Lora:ital,wght@1,400&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;
      background:linear-gradient(160deg,#fff0f4 0%,#fff9f6 60%,#f3faf5 100%);
      font-family:'Kalam',cursive;
      display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
      padding:18px 14px 30px;overflow-x:hidden;
    }
    .petal{
      position:fixed;width:9px;height:15px;
      background:radial-gradient(ellipse at 40% 30%,#f9c6ce,#e8637a44);
      border-radius:50% 0 50% 0;opacity:0;
      animation:fall linear infinite;pointer-events:none;z-index:0;
    }
    @keyframes fall{
      0%{transform:translateY(-30px) rotate(0);opacity:0}
      10%{opacity:.6}90%{opacity:.3}
      100%{transform:translateY(110vh) rotate(580deg) translateX(25px);opacity:0}
    }
    .card{
      background:#fff;border-radius:26px;width:100%;max-width:400px;
      box-shadow:0 16px 48px #e8637a18,0 0 0 1.5px #f5a0af44;
      overflow:hidden;animation:cardIn .7s cubic-bezier(.175,.885,.32,1.275) both;
      z-index:10;position:relative;
    }
    @keyframes cardIn{from{transform:scale(.84) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}

    /* HEADER */
    .hdr{
      background:linear-gradient(145deg,#fce4ec,#ffd6e4,#ffeef2);
      padding:26px 20px 22px;text-align:center;position:relative;overflow:hidden;
    }
    .hdr::before{
      content:'';position:absolute;width:180px;height:180px;border-radius:50%;
      background:radial-gradient(circle,#f9b8cb44,transparent 70%);top:-60px;right:-50px;
    }
    .flower-row{font-size:19px;letter-spacing:5px;display:block;margin-bottom:12px;position:relative;z-index:1;animation:sway 3s ease-in-out infinite;}
    @keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
    .puppy-wrap{position:relative;display:inline-block;margin-bottom:12px;z-index:1;}
    .puppy-circle{
      width:100px;height:100px;border-radius:50%;
      background:linear-gradient(135deg,#ffc8d8,#ffadc5);
      display:flex;align-items:center;justify-content:center;
      margin:0 auto;box-shadow:0 4px 18px #e05c7a33;border:3px solid #fff;
      animation:pfloat 3s ease-in-out infinite;
    }
    @keyframes pfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .sparkle{position:absolute;top:-4px;right:0;font-size:18px;animation:sp 2.5s ease-in-out infinite;}
    @keyframes sp{0%,100%{transform:rotate(-10deg) scale(1)}50%{transform:rotate(15deg) scale(1.2)}}
    .name-tag{
      display:inline-block;background:linear-gradient(135deg,#e05c7a,#c94a68);
      color:#fff;font-family:'Dancing Script',cursive;font-size:1.15rem;font-weight:700;
      padding:5px 18px;border-radius:50px;margin-bottom:10px;
      box-shadow:0 3px 12px #e05c7a44;position:relative;z-index:1;
      animation:namepulse 2s ease-in-out infinite;
    }
    @keyframes namepulse{0%,100%{box-shadow:0 3px 12px #e05c7a44}50%{box-shadow:0 3px 22px #e05c7a88}}
    .sorry-headline{
      font-family:'Dancing Script',cursive;font-size:clamp(2.4rem,10vw,3.2rem);
      font-weight:700;color:#e05c7a;line-height:1.1;display:block;
      position:relative;z-index:1;text-shadow:0 2px 14px #f5a0b555;margin-bottom:4px;
    }
    .sorry-tagline{
      font-family:'Lora',serif;font-style:italic;
      font-size:clamp(.78rem,3vw,.9rem);color:#9a6070;
      display:block;position:relative;z-index:1;margin-bottom:12px;
    }
    .hdivider{display:flex;align-items:center;justify-content:center;gap:8px;position:relative;z-index:1;}
    .hdivider .ln{display:block;height:1px;width:55px;background:linear-gradient(to right,transparent,#f5a0b5aa)}
    .hdivider .ln.r{background:linear-gradient(to left,transparent,#f5a0b5aa)}
    .hicon{font-size:14px;animation:hbeat 1.4s ease-in-out infinite}
    @keyframes hbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}

    /* BODY */
    .body{padding:20px 18px 22px}

    /* Emotional letter style */
    .letter{
      font-size:clamp(.9rem,3.6vw,1rem);
      color:#3a1f28;line-height:2.1;
      text-align:center;
      word-break:break-word;
      margin-bottom:18px;
    }

    .letter-para{
      background:#fdeef2;border-radius:16px;
      padding:18px 18px;margin-bottom:12px;
      border-left:3px solid #f5a0b5;
    }

    .letter-para.soft{
      background:#fff5f8;
      border-left:3px solid #f9c6ce;
      font-style:italic;
      color:#6b3040;
    }

    .highlight{color:#e05c7a;font-weight:700;}

    .sorry-text{
      font-size:clamp(.96rem,3.8vw,1.08rem);font-weight:700;color:#e05c7a;
      display:block;margin:8px 0 4px;line-height:1.6;
      animation:pc 2.5s ease-in-out infinite;
    }
    @keyframes pc{0%,100%{color:#e05c7a}50%{color:#a83558}}

    /* BUTTONS */
    .btns{display:flex;flex-direction:column;align-items:center;position:relative;min-height:180px;margin-top:6px;padding-bottom:12px;}
    .btn-yes{
      background:linear-gradient(135deg,#e05c7a,#c94a68);color:#fff;
      border:none;border-radius:50px;padding:15px 0;
      font-family:'Kalam',cursive;font-size:clamp(1rem,4vw,1.08rem);font-weight:700;
      cursor:pointer;width:100%;box-shadow:0 4px 18px #e05c7a44;
      position:relative;z-index:2;margin-bottom:12px;
      transition:transform .15s;
    }
    .btn-yes:active{transform:scale(.97)}
    .btn-no{
      background:#f5f5f5;color:#999;border:2px dashed #ddd;border-radius:50px;
      padding:12px 28px;font-family:'Kalam',cursive;
      font-size:clamp(.86rem,3.5vw,.96rem);
      cursor:pointer;position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
      white-space:nowrap;user-select:none;-webkit-user-select:none;touch-action:none;z-index:3;
    }

    /* SUCCESS */
    .success{display:none;flex-direction:column;align-items:center;gap:12px;padding:8px 16px 0;text-align:center;}
    .success.show{display:flex}
    .s-emoji{font-size:58px;animation:sb .5s ease-in-out 4}
    @keyframes sb{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
    .s-msg{font-family:'Dancing Script',cursive;font-size:clamp(1.5rem,6vw,1.9rem);color:#e05c7a;font-weight:700}
    .s-note{
      font-size:clamp(.86rem,3.4vw,.96rem);
      color:#9a6070;line-height:1.9;
      background:#fdeef2;border-radius:14px;
      padding:14px 16px;width:100%;
    }

    .cp{position:fixed;width:8px;height:8px;opacity:0;pointer-events:none;animation:cf 1.6s ease-out forwards;z-index:9998}
    @keyframes cf{0%{transform:translateY(0) rotate(0) scale(1);opacity:1}100%{transform:translateY(260px) rotate(540deg) scale(.2);opacity:0}}
    .hb{position:fixed;font-size:20px;pointer-events:none;animation:hburst 1.1s ease-out forwards;z-index:9999}
    @keyframes hburst{0%{transform:scale(0) translateY(0);opacity:1}60%{opacity:1}100%{transform:scale(1.4) translateY(-90px);opacity:0}}
  </style>
</head>
<body>

<div id="petals"></div>

<div class="card">
  <div class="hdr">
    <span class="flower-row">🌸 🌷 💕 🌷 🌸</span>
    <div class="puppy-wrap">
      <div class="puppy-circle">
        <svg viewBox="0 0 100 100" width="82" height="82" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="50" cy="73" rx="27" ry="19" fill="#f5c98a"/>
          <circle cx="50" cy="44" r="26" fill="#f5c98a"/>
          <ellipse cx="26" cy="36" rx="10" ry="16" fill="#e8a855" transform="rotate(-15 26 36)"/>
          <ellipse cx="74" cy="36" rx="10" ry="16" fill="#e8a855" transform="rotate(15 74 36)"/>
          <ellipse cx="26" cy="37" rx="6" ry="11" fill="#f5b8c8" transform="rotate(-15 26 37)"/>
          <ellipse cx="74" cy="37" rx="6" ry="11" fill="#f5b8c8" transform="rotate(15 74 37)"/>
          <ellipse cx="50" cy="50" rx="13" ry="9" fill="#fff0d8"/>
          <ellipse cx="38" cy="42" rx="6" ry="7" fill="white"/>
          <ellipse cx="62" cy="42" rx="6" ry="7" fill="white"/>
          <circle cx="39" cy="44" r="3.5" fill="#3a2010"/>
          <circle cx="63" cy="44" r="3.5" fill="#3a2010"/>
          <circle cx="40.5" cy="42.5" r="1.2" fill="white"/>
          <circle cx="64.5" cy="42.5" r="1.2" fill="white"/>
          <path d="M33 37 Q38 33 43 36" stroke="#a0622a" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M57 36 Q62 33 67 37" stroke="#a0622a" stroke-width="2" fill="none" stroke-linecap="round"/>
          <ellipse cx="50" cy="51" rx="4" ry="2.5" fill="#cc7733"/>
          <path d="M44 57 Q50 53 56 57" stroke="#cc7733" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <ellipse cx="35" cy="50" rx="1.8" ry="3" fill="#7ec8e3" opacity=".85">
            <animate attributeName="cy" from="48" to="61" dur="1.2s" repeatCount="indefinite"/>
            <animate attributeName="opacity" from=".9" to="0" dur="1.2s" repeatCount="indefinite"/>
          </ellipse>
          <ellipse cx="65" cy="50" rx="1.8" ry="3" fill="#7ec8e3" opacity=".85">
            <animate attributeName="cy" from="48" to="61" dur="1s" begin=".3s" repeatCount="indefinite"/>
            <animate attributeName="opacity" from=".9" to="0" dur="1s" begin=".3s" repeatCount="indefinite"/>
          </ellipse>
          <rect x="31" y="75" width="38" height="17" rx="3" fill="white" stroke="#e05c7a" stroke-width="1.5"/>
          <text x="50" y="87.5" text-anchor="middle" font-family="Arial" font-size="8.5" font-weight="bold" fill="#e05c7a">SORRY</text>
        </svg>
      </div>
      <span class="sparkle">✨</span>
    </div>
    <div class="name-tag">Shreya, I'm Sorry 💕</div>
    <span class="sorry-headline">I'm Sorry...</span>
    <span class="sorry-tagline">from the bottom of my heart</span>
    <div class="hdivider">
      <span class="ln"></span><div class="hicon">💗</div><span class="ln r"></span>
    </div>
  </div>

  <div class="body">
    <div id="apologySection">

      <div class="letter">
